name: Agentic flow

on:
  pull_request:
  push:
    branches: [main]

jobs:
  agentic-flow:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Assert agentic flow (fail-closed)
        shell: pwsh
        run: ./scripts/ticket/Assert-AgenticFlow.ps1

      - name: Script Pester tests
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted -ErrorAction SilentlyContinue
          Install-Module Pester -Force -Scope CurrentUser -MinimumVersion 5.0 -MaximumVersion 5.99.99
          Invoke-Pester ./scripts/ticket,./scripts/lib -Output Detailed -CI

      - name: Assert-TicketArtifacts fixture checks
        shell: pwsh
        run: |
          $fixture = './scripts/ticket/fixtures'
          ./scripts/ticket/Assert-TicketArtifacts.ps1 -Ticket WI00001 -Phase start    -Root $fixture
          ./scripts/ticket/Assert-TicketArtifacts.ps1 -Ticket WI00001 -Phase implement -Root $fixture
          ./scripts/ticket/Assert-TicketArtifacts.ps1 -Ticket WI00001 -Phase close    -Root $fixture

      - name: Hook smoke tests (Cursor)
        run: |
          node hooks/tests/closeout-guard.test.js
          node hooks/tests/session-context.test.js
          node hooks/tests/git-push-agentic-flow.test.js
          node hooks/tests/ticket-command-nudge.test.js
          node hooks/tests/commit-guard.test.js
          node hooks/tests/context-usage.test.js

      - name: Hook smoke tests (Claude Code bridges)
        run: node adapters/claude/hooks/tests/claude-hooks.test.js
