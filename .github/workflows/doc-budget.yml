name: Agentic flow

on:
  pull_request:
  push:
    branches: [main]

jobs:
  agentic-flow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Assert agentic flow (fail-closed)
        shell: pwsh
        run: ./scripts/ticket/Assert-AgenticFlow.ps1

      # Template: Cursor hooks only (no Claude Code bridge)
      - name: Hook smoke tests (Cursor)
        run: |
          node hooks/tests/closeout-guard.test.js
          node hooks/tests/session-context.test.js
